<rect width="1420" height="860" rx="18" fill="#ffffff"/>
<rect x="20" y="30" width="262" height="790" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
<text x="36" y="57" font-size="16" font-weight="700" fill="#9ca3af">Laptop</text>
<text x="36" y="75" font-size="12" fill="#4b5563">Windows, Python 3.13</text>
<rect x="40" y="90" width="222" height="100" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<text x="151.0" y="118.5" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Thermal clips</text>
<text x="151.0" y="135.5" font-size="11.5" fill="#4b5563" text-anchor="middle">CDnet 2014: library, corridor,</text>
<text x="151.0" y="152.5" font-size="11.5" fill="#4b5563" text-anchor="middle">diningRoom, park, lakeSide</text>
<text x="151.0" y="169.5" font-size="11.5" fill="#4b5563" text-anchor="middle">320x240, 8 bit (prepare_clips.py)</text>
<rect x="40" y="225" width="222" height="100" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<rect x="40" y="231" width="6" height="88" rx="3" fill="#2563eb"/>
<text x="154.0" y="253.5" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">run_demo.py</text>
<text x="154.0" y="270.5" font-size="11.5" fill="#4b5563" text-anchor="middle">copies the clips to the board,</text>
<text x="154.0" y="287.5" font-size="11.5" fill="#4b5563" text-anchor="middle">sets T_MASK per scene, resets</text>
<text x="154.0" y="304.5" font-size="11.5" fill="#4b5563" text-anchor="middle">the NUC, plays a playlist</text>
<rect x="40" y="370" width="222" height="100" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<rect x="40" y="376" width="6" height="88" rx="3" fill="#7c3aed"/>
<text x="154.0" y="398.5" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">viewer.py (OpenCV)</text>
<text x="154.0" y="415.5" font-size="11.5" fill="#4b5563" text-anchor="middle">raw | NUC-corrected, thermal</text>
<text x="154.0" y="432.5" font-size="11.5" fill="#4b5563" text-anchor="middle">colours, motion boxes,</text>
<text x="154.0" y="449.5" font-size="11.5" fill="#4b5563" text-anchor="middle">status and latency line</text>
<rect x="40" y="560" width="222" height="100" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<rect x="40" y="566" width="6" height="88" rx="3" fill="#9ca3af"/>
<text x="154.0" y="588.5" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">USB-Blaster (optional)</text>
<text x="154.0" y="605.5" font-size="11.5" fill="#4b5563" text-anchor="middle">viewer.py over JTAG: 6 MHz</text>
<text x="154.0" y="622.5" font-size="11.5" fill="#4b5563" text-anchor="middle">JTAG clock, slow but needs</text>
<text x="154.0" y="639.5" font-size="11.5" fill="#4b5563" text-anchor="middle">no network</text>
<rect x="40" y="700" width="222" height="90" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<text x="151.0" y="723.5" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Reproducibility</text>
<text x="151.0" y="740.5" font-size="11.5" fill="#4b5563" text-anchor="middle">Python bit-accurate model,</text>
<text x="151.0" y="757.5" font-size="11.5" fill="#4b5563" text-anchor="middle">Icarus testbenches, mutation</text>
<text x="151.0" y="774.5" font-size="11.5" fill="#4b5563" text-anchor="middle">self-test (scripts/)</text>
<path d="M 151,190 L 151,225" fill="none" stroke="#374151" stroke-width="2"  marker-end="url(#a374151)" />
<rect x="350" y="30" width="1050" height="790" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="366" y="57" font-size="16" font-weight="700" fill="#6b7280">DE10-Standard board</text>
<text x="366" y="75" font-size="12" fill="#4b5563">Cyclone V SoC 5CSXFC6D6F31C6: HPS (ARM) and FPGA fabric in one chip</text>
<rect x="370" y="90" width="270" height="420" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="386" y="117" font-size="16" font-weight="700" fill="#2563eb">HPS: ARM Cortex-A9, Linux</text>
<text x="386" y="135" font-size="12" fill="#4b5563">Terasic image, started from the SD card</text>
<rect x="388" y="145" width="234" height="128" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<rect x="388" y="151" width="6" height="116" rx="3" fill="#2563eb"/>
<text x="508.0" y="179.0" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">frame_feeder (C, static ARM binary)</text>
<text x="508.0" y="196.0" font-size="11.5" fill="#4b5563" text-anchor="middle">serve: TCP :5002, register and picture</text>
<text x="508.0" y="213.0" font-size="11.5" fill="#4b5563" text-anchor="middle">access for the laptop</text>
<text x="508.0" y="230.0" font-size="11.5" fill="#4b5563" text-anchor="middle">play: loops a clip from /tmp</text>
<text x="508.0" y="247.0" font-size="11.5" fill="#4b5563" text-anchor="middle">chase writer: never a torn frame</text>
<rect x="388" y="295" width="234" height="66" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<text x="505.0" y="323.5" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">/tmp RAM disk</text>
<text x="505.0" y="340.5" font-size="11.5" fill="#4b5563" text-anchor="middle">the clips (the SD card has no room)</text>
<rect x="388" y="383" width="234" height="66" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<text x="505.0" y="411.5" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Ethernet + ssh / scp</text>
<text x="505.0" y="428.5" font-size="11.5" fill="#4b5563" text-anchor="middle">192.168.137.200 (Windows ICS)</text>
<rect x="388" y="463" width="234" height="34" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
<text x="505.0" y="484.0" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">SD card boots the FPGA image</text>
