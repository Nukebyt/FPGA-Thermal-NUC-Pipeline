<text x="751" y="117" font-size="16" font-weight="700" fill="#ea580c">FPGA fabric</text>
<text x="751" y="135" font-size="12" fill="#4b5563">25 MHz pixel clock, 8,575 ALMs (20 %), 551 of 553 RAM blocks</text>
<rect x="752" y="158" width="124" height="440" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
<text x="814.0" y="254.5" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Host bus</text>
<text x="814.0" y="271.5" font-size="11.5" fill="#4b5563" text-anchor="middle">Avalon-MM slave</text>
<text x="814.0" y="288.5" font-size="11.5" fill="#4b5563" text-anchor="middle">(host_if)</text>
<text x="814.0" y="305.5" font-size="11.5" fill="#4b5563" text-anchor="middle"></text>
