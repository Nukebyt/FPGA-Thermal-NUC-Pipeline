<text x="814.0" y="339.5" font-size="11.5" fill="#4b5563" text-anchor="middle">CSRs: controls,</text>
<text x="814.0" y="356.5" font-size="11.5" fill="#4b5563" text-anchor="middle">T_MASK, LEARN_N,</text>
<text x="814.0" y="373.5" font-size="11.5" fill="#4b5563" text-anchor="middle">status, latency</text>
<text x="814.0" y="390.5" font-size="11.5" fill="#4b5563" text-anchor="middle"></text>
