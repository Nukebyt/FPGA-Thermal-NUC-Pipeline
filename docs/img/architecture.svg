<text x="814.0" y="424.5" font-size="11.5" fill="#4b5563" text-anchor="middle">capture buffer</text>
<text x="814.0" y="441.5" font-size="11.5" fill="#4b5563" text-anchor="middle">(read)</text>
<text x="814.0" y="458.5" font-size="11.5" fill="#4b5563" text-anchor="middle"></text>
<text x="814.0" y="475.5" font-size="11.5" fill="#4b5563" text-anchor="middle">0x40000</text>
<text x="814.0" y="492.5" font-size="11.5" fill="#4b5563" text-anchor="middle">scene store</text>
<text x="814.0" y="509.5" font-size="11.5" fill="#4b5563" text-anchor="middle">(write)</text>
